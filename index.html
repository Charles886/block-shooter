<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方塊射擊 - Block Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    justify-content: center;
    gap: 12px;
  }
  h1 { font-size: 20px; font-weight: 600; color: #58a6ff; }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 15px;
    background: #161b22;
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid #30363d;
  }
  #hud b { color: #58a6ff; }
  #wrap { position: relative; }
  canvas {
    background: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    cursor: crosshair;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(13, 17, 23, 0.85);
    border-radius: 8px;
    text-align: center;
  }
  #overlay h2 { font-size: 32px; color: #f0f6fc; }
  #overlay p { font-size: 15px; color: #8b949e; line-height: 1.8; }
  #overlay button {
    font-size: 16px;
    padding: 10px 28px;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #overlay button:hover { background: #2ea043; }
  #name-input { font-size:15px; padding:8px 12px; border-radius:6px; border:1px solid #30363d; background:#0d1117; color:#c9d1d9; }
  #save-score { font-size:15px; padding:8px 16px; background:#238636; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  #save-score:hover { background:#2ea043; }
  #leaderboard { font-size:14px; width:78%; margin:8px 0; }
  #leaderboard table { width:100%; border-collapse:collapse; }
  #leaderboard th, #leaderboard td { padding:4px 10px; border-bottom:1px solid #30363d; text-align:left; }
  #leaderboard th { color:#8b949e; font-weight:600; }
  #leaderboard tr.me td { color:#58a6ff; font-weight:700; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>方塊射擊 Block Shooter</h1>
  <div id="hud">
    <span>分數 <b id="score">0</b></span>
    <span>生命 <b id="hp">100</b></span>
    <span>波次 <b id="wave">1</b></span>
    <span>連擊 <b id="combo">x1</b></span>
    <span>武器 <b id="weapon">-</b></span>
  </div>
  <div id="wrap">
    <canvas id="game" width="960" height="560"></canvas>
    <div id="overlay">
      <h2 id="ov-title">方塊射擊</h2>
      <p id="ov-text">
        滑鼠移動 — 操控方塊<br>
        點擊 / 長按 — 射擊紅色敵方方塊<br>
        躲開敵方子彈，撐過每一波<br>
        空白鍵 — 暫停 &nbsp;·&nbsp; 撿取彩色掉落方塊可獲得武器
      </p>
      <button id="ov-btn">開始遊戲</button>
      <div id="leaderboard" class="hidden"></div>
      <div id="score-entry" class="hidden">
        <p>輸入名字以記錄分數</p>
        <div style="display:flex; gap:8px; justify-content:center;">
          <input id="name-input" maxlength="12" placeholder="你的名字">
          <button id="save-score">存檔</button>
        </div>
      </div>
      </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
